; ESP32 BoatHub - firmware
;
; Target is the unbranded ESP32-S3 N16R8 module on the MRD076A carrier
; described in docs/design/A-001-devkit-and-carrier.md.
;
; PlatformIO has no N16R8 board definition. "esp32-s3-devkitc-1" is the N8
; variant without PSRAM, so everything specific to N16R8 is overridden below.

[platformio]
default_envs = boathub

[env:boathub]
platform = platformio/espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8: 16 MB flash, 8 MB octal PSRAM ---
; qio_opi is mandatory: the R8 carries OCTAL PSRAM. Without it the PSRAM stays
; dead silently. It is also why GPIO33-37 are off limits (see A-001).
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Note: the ROM boot log still prints "mode:DIO". PlatformIO deliberately
; writes dio into the image header (builder/main.py maps qio -> dio); the
; second-stage bootloader then switches the flash to the real mode from
; qio_opi. That line is expected and not a misconfiguration.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; The firmware itself. The other environments below swap the sources.
build_src_filter = +<*> -<bringup/> -<play/>

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial = UART0 = the CH343P port. With CDC_ON_BOOT=1 the serial monitor
    ; would move to the native USB port and stay silent. See A-002 section 4.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
; esp32_exception_decoder turns backtraces into file:line - the main tool for
; the brownout diagnosis this phase is about.
monitor_filters = esp32_exception_decoder, time

; Pinned to the CH343P port (VID:PID 1A86:55D3, serial 5C94134306). The board's
; other USB-C port is the native ESP32-S3 USB and must not be used here, because
; this firmware sets ARDUINO_USB_CDC_ON_BOOT=0. With two DevKits in the project
; this also stops the wrong board being flashed. Recheck with "pio device list"
; if Windows renumbers the port.
upload_port = COM9
monitor_port = COM9
upload_speed = 921600

; ---------------------------------------------------------------------------
; Board verification. Checks flash size, octal PSRAM and the partition table
; over the serial port, so a wrong board configuration cannot pass as a
; successful build. Flash it when a board is new or behaving oddly.
;
;   pio run -d board -e bringup -t upload -t monitor
; ---------------------------------------------------------------------------
[env:bringup]
extends = env:boathub
build_src_filter = +<bringup/>

; ---------------------------------------------------------------------------
; Sandbox for learning the Arduino/ESP32 model. Same board settings, different
; sources, so neither the firmware nor the bring-up check is disturbed.
;
;   pio run -d board -e play -t upload
;
; Needs no parts beyond the DevKit: it uses the onboard WS2812 and BOOT button.
;
; One entry point per sandbox, so each gets its own environment rather than
; sharing one with a mode switch - two files in src/play/ would both define
; setup() and loop().
; ---------------------------------------------------------------------------
[env:play]
extends = env:boathub
build_src_filter = +<play/led.cpp>

; ---------------------------------------------------------------------------
; I2C bus scanner. Checks the bus electrically, then reports which addresses
; answer, rescanning every two seconds so a module can be plugged in and
; watched appearing. Use it when a sensor is new or has stopped answering.
;
;   pio run -d board -e i2cscan -t upload -t monitor
; ---------------------------------------------------------------------------
[env:i2cscan]
extends = env:boathub
build_src_filter = +<play/i2cscan.cpp>

; ---------------------------------------------------------------------------
; ADS1115 bench meter. Prints every channel of every module it finds, in
; volts, with a bar - so a potentiometer swept across the 3.3 V rail shows the
; whole scale and any dead patch in it.
;
;   pio run -d board -e adsread -t upload -t monitor
;
; Wanted twice: now, to prove the converter converts, and in phase B to watch
; the battery divider against a multimeter before trusting a calibration
; factor.
; ---------------------------------------------------------------------------
[env:adsread]
extends = env:boathub
build_src_filter = +<play/adsread.cpp>
; Its own dependencies, replacing the firmware's: this sandbox needs neither
; MQTT nor JSON, and the ADS1115 library is not wanted in the firmware build
; until phase B actually reads one. SPI is named because Adafruit BusIO
; includes it unconditionally, even on an I2C-only device.
lib_deps =
    adafruit/Adafruit ADS1X15@^2.5
    SPI

# BoatHub MQTT broker

listener 1883
protocol mqtt

# Mosquitto 2.x denies anonymous access by default. That default is kept:
# every client authenticates, including the board.
allow_anonymous false
password_file /mosquitto/config/passwd

# Retained messages have to survive a container restart, otherwise a client
# connecting after a restart cannot tell whether the boat is online.
#
# Persistence also backs the ingest service's session: it connects with clean
# session off, so while it is restarting the broker holds its messages here
# rather than discarding them.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# The board buffers measurements at sea and uploads the backlog when it finds a
# connection. If the ingest service happens to be down at that moment, the
# broker has to hold the whole backlog for it. The default of 1000 would be a
# few hours; this is weeks.
#
# Bounded rather than unlimited on purpose: a queue that can grow without limit
# turns a stuck consumer into a broker that runs the host out of memory.
max_queued_messages 100000

# Left at the default of 20 deliberately. It is the backpressure that stops a
# database outage turning into lost measurements: ingest acknowledges only
# after the row is written, so unacknowledged messages stall delivery instead
# of being dropped.
#max_inflight_messages 20

# To the container log, so `docker compose logs -f` shows everything.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

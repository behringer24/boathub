# BoatHub broker.
#
# Design: ../../../docs/design/A-006-telemetry-storage.md

# --- Plain MQTT, inside the compose network only -----------------------------
#
# Not published to the host on the server: ingest and anything else in this
# stack reach the broker over Docker's own network, where the traffic never
# leaves the machine. On a development machine it can be published, and then it
# belongs on a trusted LAN - the credentials cross it in the clear.
listener 1883
protocol mqtt

# --- MQTT over TLS, the port the boat uses -----------------------------------
#
# The certificate comes from whatever already manages Let's Encrypt on this
# host; deploy/install-certs.sh copies it in and reloads the broker. Mosquitto
# re-reads these files on SIGHUP, so a renewal costs no downtime.
#
# Commented out until the certificate files exist: mosquitto refuses to start
# without them, and a broker that will not start is a worse first experience
# than one without TLS.
#listener 8883
#protocol mqtt
#certfile /mosquitto/certs/fullchain.pem
#keyfile /mosquitto/certs/privkey.pem
#
# The board authenticates with a username and password, not a client
# certificate. TLS here is about privacy and about the board knowing it is
# talking to the right server - the identity of the board is the credential.
#require_certificate false
#
# TLS 1.2 at minimum. The ESP32's mbedTLS does 1.2 and 1.3; nothing older has
# any business carrying credentials.
#tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# A backlog uploaded after a trip must survive ingest being down at that
# moment. See A-006.
max_queued_messages 100000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

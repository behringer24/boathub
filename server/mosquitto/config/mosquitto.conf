# BoatHub MQTT broker

listener 1883
protocol mqtt

# Mosquitto 2.x denies anonymous access by default. That default is kept:
# every client authenticates, including the board.
allow_anonymous false
password_file /mosquitto/config/passwd

# Retained messages have to survive a container restart, otherwise a client
# connecting after a restart cannot tell whether the boat is online.
persistence true
persistence_location /mosquitto/data/

# To the container log, so `docker compose logs -f` shows everything.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

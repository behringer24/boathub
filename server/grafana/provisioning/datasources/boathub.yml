apiVersion: 1

datasources:
  - name: BoatHub
    uid: boathub
    type: postgres
    access: proxy
    url: db:5432
    user: boathub
    isDefault: true
    jsonData:
      database: boathub
      # The database is not published outside the compose network, so there is
      # nothing here for TLS to protect.
      sslmode: disable
      postgresVersion: 1600
      # Lets Grafana offer time_bucket instead of generic time grouping.
      timescaledb: true
    secureJsonData:
      password: ${BOATHUB_DB_PASSWORD}

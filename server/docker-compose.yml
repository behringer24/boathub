# Passwords come from .env, which is not in git. Copy .env.example to .env and
# fill it in - see README.md.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: boathub-mqtt
    restart: unless-stopped
    ports:
      # 1883 is the IANA-registered MQTT port. 8883 is reserved for the TLS
      # step and is deliberately not published yet.
      - "1883:1883"
    volumes:
      # Read-only: the broker never writes here. The passwd file has to exist
      # before the first start - see README.md.
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  db:
    image: timescale/timescaledb-ha:pg16
    container_name: boathub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: boathub
      POSTGRES_USER: boathub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/home/postgres/pgdata/data
      # Runs once, only when the data directory is created for the first time.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Not published on purpose: only ingest and Grafana need it, and both are
    # on this network. Add a ports entry when you want psql from the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boathub -d boathub"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingest:
    build: ./ingest
    container_name: boathub-ingest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DATABASE_URL: postgres://boathub:${POSTGRES_PASSWORD}@db:5432/boathub
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-boathub}
      MQTT_PASS: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}

  grafana:
    image: grafana/grafana:11.3.0
    container_name: boathub-grafana
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      BOATHUB_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  mosquitto-data:
  mosquitto-log:
  db-data:
  grafana-data:
